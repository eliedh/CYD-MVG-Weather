<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1015">
<title>Abfahrt</title>
<style>
:root{--bg:#0D1015;--surface:#171C24;--surface-hi:#1E2530;--divider:#232A35;--text:#F3F5F8;--text2:#A3ACBA;--text3:#677181;--accent:#3DDC97;--accent-ink:#06281A;--warn:#F7B548;--danger:#FF6B6B;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px 120px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;align-content:center;gap:4px;padding:0 8px;flex:none}
.logo i{display:block;height:5px;border-radius:3px;background:var(--accent-ink)}.logo i:nth-child(2){width:55%}.logo i:nth-child(3){width:75%}
.brand b{font-size:22px;letter-spacing:-.01em}
.status{color:var(--text3);font-size:14px;margin:0 0 28px 48px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.status .dot.warn{background:var(--warn)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:32px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px}
.stop-head{display:flex;gap:12px;align-items:flex-start}
.stop-head .grow{flex:1;min-width:0}
.stop-head b{display:block;font-size:17px}
small,.muted{color:var(--text3);font-size:14px}
.icon-btn{border:0;background:var(--surface-hi);color:var(--text2);width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--divider)}
.field:first-of-type{margin-top:12px}
.field label{color:var(--text2)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:0;background:var(--surface-hi);color:var(--text);font-size:20px;cursor:pointer}
.stepper span{min-width:64px;text-align:center;font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=time]{padding:12px;border-radius:12px;border:1px solid var(--divider);background:var(--bg);color:var(--text);font:inherit;font-size:16px;min-width:0}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.field input[type=text]{width:55%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px;border-top:1px solid var(--divider)}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--divider);background:none;color:var(--text3);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--surface-hi);color:var(--text);border-color:var(--surface-hi)}
.chip.on:before{content:"✓ ";color:var(--accent)}
.expander{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--surface-hi);color:var(--text);font:inherit;text-align:left;cursor:pointer;display:flex;justify-content:space-between}
.expander small{color:var(--text3)}
.lines{margin-top:8px}
.line-group{padding:10px 0;border-bottom:1px solid var(--divider)}
.line-group:last-child{border-bottom:0}
.check{display:flex;align-items:center;gap:12px;padding:8px 2px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check.dir{padding-left:36px;color:var(--text2)}
.check.off{opacity:.45}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:24px;padding:0 6px;border-radius:4px;color:#fff;font-weight:700;font-size:14px}
.search{display:flex;gap:8px}
.search input{flex:1}
.btn{padding:12px 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:inherit;font-weight:600;font-size:16px;line-height:1.2;cursor:pointer}
.btn.ghost{background:var(--surface-hi);color:var(--text)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--divider)}
.btn.wide{width:100%}
.results{margin-top:8px}
.result{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px;border:0;border-radius:10px;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.result:active{background:var(--surface-hi)}
.result .plus{color:var(--accent);font-weight:700;font-size:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 8px;border:0;border-radius:9px;background:none;color:var(--text2);font:inherit;font-size:15px;cursor:pointer}
.seg button.on{background:var(--surface-hi);color:var(--text);font-weight:600}
.toggle{position:relative;width:52px;height:32px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--surface-hi);transition:.2s}
.toggle span:after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--text2);transition:.2s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span:after{transform:translateX(20px);background:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.stack>*+*{margin-top:12px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.times label{display:block;color:var(--text3);font-size:13px;margin-bottom:4px}
.times input{width:100%}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center;transform:translateY(120%);transition:transform .25s}
.savebar.show{transform:none}
.savebar .btn{width:100%;max-width:488px;padding:16px;font-size:17px;box-shadow:0 8px 24px #0008}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-150%);background:var(--surface-hi);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px #0008;transition:transform .25s;z-index:9;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--text3)}.kv dd{margin:0;text-align:right;color:var(--text2)}
.empty{color:var(--text2);text-align:center;padding:12px}
.spinner{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--surface-hi);border-top-color:var(--accent);animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(1turn)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="logo"><i></i><i></i><i></i></div><b>Abfahrt</b></div>
  <p class="status" id="status">&nbsp;</p>

  <h2><span data-t="stops"></span><span id="stopCount"></span></h2>
  <div id="stops"></div>
  <div class="card" id="addCard">
    <div class="stack">
      <b data-t="addStop"></b>
      <form class="search" onsubmit="searchStops(event)">
        <input type="search" id="q" data-tp="searchPh" autocomplete="off" enterkeyhint="search">
        <button class="btn" data-t="search"></button>
      </form>
    </div>
    <div class="results" id="results"></div>
  </div>

  <h2 data-t="weather"></h2>
  <div class="card">
    <div class="field" style="border:0;margin:0;padding-top:0"><label data-t="weatherOverride"></label>
      <label class="toggle"><input type="checkbox" id="wxOverride" onchange="setWx()"><span></span></label></div>
    <p class="muted" id="wxInfo" style="margin:4px 0 0"></p>
    <div id="wxBox" hidden class="stack" style="margin-top:12px">
      <form class="search" onsubmit="searchWx(event)">
        <input type="search" id="wxq" data-tp="wxSearchPh" autocomplete="off" enterkeyhint="search">
        <button class="btn ghost" data-t="search"></button>
      </form>
      <div class="results" id="wxResults"></div>
      <div class="times">
        <div><label data-t="lat"></label><input type="number" step="0.0001" id="wxLat" oninput="wxManual()"></div>
        <div><label data-t="lon"></label><input type="number" step="0.0001" id="wxLon" oninput="wxManual()"></div>
      </div>
    </div>
  </div>

  <h2 data-t="display"></h2>
  <div class="card stack">
    <div><div class="muted" style="margin-bottom:8px" data-t="language"></div>
      <div class="seg" id="langSeg"><button data-v="de">Deutsch</button><button data-v="en">English</button></div></div>
    <div><div class="muted" style="margin-bottom:4px"><span data-t="brightness"></span> <span id="brVal"></span></div>
      <input type="range" min="5" max="100" id="br" oninput="setBr()"></div>
    <div class="field" style="margin:0"><label data-t="autoBrightness"></label>
      <label class="toggle"><input type="checkbox" id="auto" onchange="cfg.display.auto=this.checked;dirty()"><span></span></label></div>
    <div><div class="muted" style="margin-bottom:8px" data-t="nightMode"></div>
      <div class="seg" id="nightSeg"><button data-v="off" data-t="nightOff"></button><button data-v="dim" data-t="nightDim"></button><button data-v="dark" data-t="nightDark"></button></div></div>
    <div class="times" id="nightTimes">
      <div><label data-t="from"></label><input type="time" id="nStart" onchange="setNight()"></div>
      <div><label data-t="to"></label><input type="time" id="nEnd" onchange="setNight()"></div>
    </div>
    <p class="muted" style="margin:0" data-t="nightHint"></p>
  </div>

  <h2 data-t="system"></h2>
  <div class="card stack">
    <button class="btn ghost wide" onclick="post('/api/calibrate','calStarted')" data-t="calibrate"></button>
    <button class="btn ghost wide" onclick="confirmPost('/api/forget-wifi','confirmWifi','wifiReset')" data-t="changeWifi"></button>
    <button class="btn danger wide" onclick="confirmPost('/api/reset','confirmReset','resetDone')" data-t="factoryReset"></button>
    <dl class="kv" id="info"></dl>
    <p class="muted" style="margin:0;font-size:13px" data-t="sources"></p>
  </div>
</main>
<div class="savebar" id="savebar"><button class="btn" onclick="save()" data-t="save"></button></div>
<div class="toast" id="toast"></div>
<script>
const I18N={
de:{stops:"Haltestellen",addStop:"Haltestelle hinzufügen",searchPh:"z. B. Marienplatz",search:"Suchen",searching:"Suche …",noResults:"Nichts gefunden.",
searchError:"Suche fehlgeschlagen. Ist die Tafel online?",maxStops:"Maximal 4 Haltestellen.",noStops:"Noch keine Haltestelle. Suche unten nach deiner Haltestelle.",
walk:"Fußweg",walkHint:"Abfahrten, die du zu Fuß nicht mehr erreichst, werden grau angezeigt.",min:"Min.",shortName:"Kurzname",remove:"Entfernen",linesDirs:"Linien & Richtungen",hiddenN:"{n} ausgeblendet",allShown:"alle sichtbar",
loadingLines:"Lade aktuelle Abfahrten …",linesError:"Konnte Linien nicht laden.",linesNote:"Basierend auf den nächsten Abfahrten. Nicht angehakte Linien/Richtungen werden ausgeblendet.",
notRunning:"Gerade nicht im Fahrplan (ausgeblendet)",allDirections:"alle Richtungen",
UBAHN:"U-Bahn",SBAHN:"S-Bahn",TRAM:"Tram",BUS:"Bus",REGIONAL_BUS:"Regionalbus",BAHN:"Zug",
weather:"Wetter",weatherOverride:"Eigener Ort",wxFirst:"Wetter für die erste Haltestelle ({s}).",wxNone:"Wetter für die erste Haltestelle – füge eine hinzu.",wxCustom:"Wetter für: {s}",
wxSearchPh:"Ort über Haltestelle suchen",lat:"Breitengrad",lon:"Längengrad",custom:"eigene Koordinaten",
display:"Anzeige",language:"Sprache",brightness:"Helligkeit",autoBrightness:"Automatisch an Raumlicht anpassen",nightMode:"Nachtmodus",nightOff:"Aus",nightDim:"Dimmen",nightDark:"Dunkel",
from:"Von",to:"Bis",nightHint:"Nachts reicht ein Tippen auf die Tafel, um sie für 30 Sekunden aufzuwecken.",
system:"System",calibrate:"Touch kalibrieren",changeWifi:"WLAN ändern",factoryReset:"Alles löschen & neu einrichten",
calStarted:"Folge den Anweisungen auf der Tafel.",confirmWifi:"WLAN-Daten löschen? Die Tafel startet neu und öffnet wieder den Einrichtungs-Hotspot.",
wifiReset:"Die Tafel startet den Einrichtungs-Hotspot.",confirmReset:"Wirklich alles zurücksetzen? WLAN, Haltestellen und alle Einstellungen werden gelöscht. Danach startet die Tafel neu und öffnet den Einrichtungs-Hotspot wie beim ersten Mal.",resetDone:"Alles gelöscht. Die Tafel startet neu – verbinde dich mit „Abfahrt-Setup-…“ für die neue Einrichtung.",
save:"Änderungen speichern",saved:"Gespeichert ✓",saveError:"Speichern fehlgeschlagen.",
online:"Online",updated:"aktualisiert {t}",apiErr:"MVG gerade nicht erreichbar",version:"Firmware",ip:"IP-Adresse",signal:"WLAN-Signal",heap:"Freier Speicher",uptime:"Laufzeit",offline:"Keine Verbindung zur Tafel",lastReset:"Letzter Neustart",rst_poweron:"Eingesteckt",rst_external:"Reset-Taste",rst_software:"Neustart (Software)",rst_panic:"Absturz",rst_int_wdt:"Watchdog",rst_task_wdt:"Watchdog",rst_wdt:"Watchdog",rst_deepsleep:"Tiefschlaf",rst_brownout:"Unterspannung – anderes Netzteil/Kabel probieren",rst_sdio:"SDIO",rst_unknown:"unbekannt",rst_undefined:"–",sources:"Abfahrten: MVG (inoffizielle Schnittstelle) · Wetter: Open-Meteo.com (CC BY 4.0)"},
en:{stops:"Stops",addStop:"Add a stop",searchPh:"e.g. Marienplatz",search:"Search",searching:"Searching…",noResults:"Nothing found.",
searchError:"Search failed. Is the board online?",maxStops:"Up to 4 stops.",noStops:"No stops yet. Search for your stop below.",
walk:"Walking time",walkHint:"Departures you can no longer reach on foot are shown greyed out.",min:"min",shortName:"Short name",remove:"Remove",linesDirs:"Lines & directions",hiddenN:"{n} hidden",allShown:"all shown",
loadingLines:"Loading current departures…",linesError:"Couldn’t load lines.",linesNote:"Based on upcoming departures. Unchecked lines/directions are hidden.",
notRunning:"Not in the timetable right now (hidden)",allDirections:"all directions",
UBAHN:"U-Bahn",SBAHN:"S-Bahn",TRAM:"Tram",BUS:"Bus",REGIONAL_BUS:"Regional bus",BAHN:"Train",
weather:"Weather",weatherOverride:"Custom location",wxFirst:"Weather for the first stop ({s}).",wxNone:"Weather for the first stop – add one first.",wxCustom:"Weather for: {s}",
wxSearchPh:"Find a place via a stop name",lat:"Latitude",lon:"Longitude",custom:"custom coordinates",
display:"Display",language:"Language",brightness:"Brightness",autoBrightness:"Adapt to room light",nightMode:"Night mode",nightOff:"Off",nightDim:"Dim",nightDark:"Dark",
from:"From",to:"Until",nightHint:"At night, one tap on the board wakes it for 30 seconds.",
system:"System",calibrate:"Calibrate touch",changeWifi:"Change Wi-Fi",factoryReset:"Erase everything & set up again",
calStarted:"Follow the instructions on the board.",confirmWifi:"Forget the Wi-Fi? The board restarts and opens the setup hotspot again.",
wifiReset:"The board is starting the setup hotspot.",confirmReset:"Really reset everything? Wi-Fi, stops and all settings will be erased. The board then restarts and opens the setup hotspot like the first time.",resetDone:"Everything erased. The board restarts – join “Abfahrt-Setup-…” to set it up again.",
save:"Save changes",saved:"Saved ✓",saveError:"Saving failed.",
online:"Online",updated:"updated {t}",apiErr:"MVG is unreachable right now",version:"Firmware",ip:"IP address",signal:"Wi-Fi signal",heap:"Free memory",uptime:"Uptime",offline:"Can’t reach the board",lastReset:"Last restart",rst_poweron:"Plugged in",rst_external:"Reset button",rst_software:"Restart (software)",rst_panic:"Crash",rst_int_wdt:"Watchdog",rst_task_wdt:"Watchdog",rst_wdt:"Watchdog",rst_deepsleep:"Deep sleep",rst_brownout:"Low voltage – try another charger/cable",rst_sdio:"SDIO",rst_unknown:"unknown",rst_undefined:"–",sources:"Departures: MVG (unofficial API) · Weather: Open-Meteo.com (CC BY 4.0)"}};
const TYPES=["UBAHN","SBAHN","TRAM","BUS","REGIONAL_BUS","BAHN"];
const UC={U1:"#438136",U2:"#C40C37",U3:"#F36E31",U4:"#0AB38D",U5:"#B8740E",U6:"#006CB3",U7:"#438136,#C40C37",U8:"#C40C37,#F36E31"};
const SC={S1:"#16BAE7",S2:"#76B82A",S3:"#951B81",S4:"#E30613",S5:"#005E82",S6:"#00975F",S7:"#943126",S8:"#1A1A1A",S20:"#F05A73",S27:"#F05A73"};
let lang="de",cfg=null,info={};
const $=id=>document.getElementById(id);
const t=(k,v)=>{let s=I18N[lang][k]||k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function badge(label,type){
  let bg="#4B5563",fg="#fff",r="7px";
  if(type=="UBAHN"){bg=UC[label]||"#0065AE";r="3px";}
  else if(type=="SBAHN"){bg=SC[label]||"#408335";r="12px";if(label=="S8")fg="#FFCB06";}
  else if(type=="TRAM"){bg=/^N\d/.test(label)?"#8C1C24":"#D82020";r="3px";}
  else if(type=="BUS"){bg=/^N\d/.test(label)?"#24305E":/^X/.test(label)?"#3E8B5E":"#00586A";}
  else if(type=="REGIONAL_BUS")bg="#1D5B8F";
  else if(type=="BAHN"){bg="#6B7280";r="3px";}
  const b=bg.includes(",")?"linear-gradient(90deg,"+bg.split(",")[0]+" 50%,"+bg.split(",")[1]+" 50%)":bg;
  return '<span class="badge" style="background:'+b+';color:'+fg+';border-radius:'+r+'">'+esc(label)+"</span>";
}
function toast(msg){const e=$("toast");e.textContent=msg;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2600);}
function dirty(){$("savebar").classList.add("show");}
async function job(url){
  const r=await (await fetch(url)).json();
  if(!r.job)throw new Error("busy");
  for(let i=0;i<60;i++){await sleep(i<5?300:600);const s=await (await fetch("/api/job?id="+r.job)).json();if(s.state!="pending")return s;}
  throw new Error("timeout");
}
function applyTexts(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t(e.dataset.tp));
}
function seg(id,val,onPick){
  $(id).querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.v==val);b.onclick=()=>{onPick(b.dataset.v);};});
}
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const mins=s=>{const[a,b]=s.split(":").map(Number);return a*60+b;};

function renderAll(){
  applyTexts();
  renderStops();
  $("wxOverride").checked=cfg.weather.override;
  renderWx();
  seg("langSeg",lang,v=>{lang=v;cfg.lang=v;dirty();renderAll();});
  $("br").value=cfg.display.brightness;$("brVal").textContent=cfg.display.brightness+" %";
  $("auto").checked=cfg.display.auto;
  seg("nightSeg",cfg.night.mode,v=>{cfg.night.mode=v;dirty();renderAll();});
  $("nightTimes").hidden=cfg.night.mode=="off";
  $("nStart").value=hhmm(cfg.night.start);$("nEnd").value=hhmm(cfg.night.end);
  renderStatus();
}
function setBr(){cfg.display.brightness=+$("br").value;$("brVal").textContent=$("br").value+" %";dirty();}
function setNight(){cfg.night.start=mins($("nStart").value||"22:00");cfg.night.end=mins($("nEnd").value||"06:30");dirty();}

// ---------------------------------------------------------------- stops
function renderStops(){
  const box=$("stops");box.innerHTML="";
  $("stopCount").textContent=cfg.stops.length+" / 4";
  $("addCard").hidden=cfg.stops.length>=4;
  if(!cfg.stops.length){box.innerHTML='<div class="card empty">'+t("noStops")+"</div>";return;}
  cfg.stops.forEach((st,i)=>{
    const c=document.createElement("div");c.className="card";
    const hidden=(st.exclude||[]).length;
    c.innerHTML='<div class="stop-head"><div class="grow"><b>'+esc(st.name)+'</b></div><button class="icon-btn" title="'+t("remove")+'">×</button></div>'+
      '<div class="field"><label>'+t("walk")+'</label><div class="stepper"><button data-d="-1">−</button><span>'+st.walk+" "+t("min")+'</span><button data-d="1">+</button></div></div>'+
      '<p class="muted" style="margin:-4px 0 4px">'+t("walkHint")+"</p>"+
      '<div class="field"><label>'+t("shortName")+'</label><input type="text" maxlength="24" value="'+esc(st.label||"")+'"></div>'+
      '<div class="chips">'+TYPES.map((ty,b)=>'<button class="chip'+((st.types>>b)&1?" on":"")+'" data-b="'+b+'">'+t(ty)+"</button>").join("")+"</div>"+
      '<button class="expander"><span>'+t("linesDirs")+"</span><small>"+(hidden?t("hiddenN",{n:hidden}):t("allShown"))+" ▾</small></button>"+
      '<div class="lines" hidden></div>';
    c.querySelector(".icon-btn").onclick=()=>{cfg.stops.splice(i,1);dirty();renderAll();};
    c.querySelectorAll(".stepper button").forEach(b=>b.onclick=()=>{st.walk=Math.max(0,Math.min(60,st.walk+ +b.dataset.d));b.parentNode.querySelector("span").textContent=st.walk+" "+t("min");dirty();});
    c.querySelector("input").oninput=e=>{st.label=e.target.value;dirty();};
    c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.types^=1<<+b.dataset.b;if(!(st.types&63))st.types|=1<<+b.dataset.b;b.classList.toggle("on",(st.types>>+b.dataset.b)&1);dirty();});
    const ex=c.querySelector(".expander"),lines=c.querySelector(".lines");
    ex.onclick=()=>{lines.hidden=!lines.hidden;if(!lines.hidden&&!lines.dataset.loaded)loadLines(st,lines,ex);};
    box.appendChild(c);
  });
}
async function loadLines(st,box,ex){
  box.innerHTML='<p class="muted"><span class="spinner"></span>'+t("loadingLines")+"</p>";
  try{
    const r=await job("/api/lines?id="+encodeURIComponent(st.id));
    if(r.state!="done")throw 0;
    box.dataset.loaded=1;renderLines(st,box,ex,r.result);
  }catch(e){box.innerHTML='<p class="muted">'+t("linesError")+"</p>";}
}
function renderLines(st,box,ex,list){
  st.exclude=st.exclude||[];
  const groups=new Map();list.forEach(l=>{if(!groups.has(l.label))groups.set(l.label,{type:l.type,dirs:[]});groups.get(l.label).dirs.push(l.dest);});
  const has=k=>st.exclude.includes(k);
  const tog=k=>{has(k)?st.exclude.splice(st.exclude.indexOf(k),1):st.exclude.push(k);dirty();renderLines(st,box,ex,list);};
  let h='<p class="muted" style="margin:4px 0 8px">'+t("linesNote")+"</p>";
  for(const [label,g] of groups){
    const lineOff=has(label);
    h+='<div class="line-group"><label class="check"><input type="checkbox" data-k="'+esc(label)+'"'+(lineOff?"":" checked")+">"+badge(label,g.type)+'<span class="muted">'+t("allDirections")+"</span></label>";
    g.dirs.forEach(d=>{const k=label+">"+d;h+='<label class="check dir'+(lineOff?" off":"")+'"><input type="checkbox" data-k="'+esc(k)+'"'+(has(k)||lineOff?"":" checked")+(lineOff?" disabled":"")+">"+esc(d)+"</label>";});
    h+="</div>";
  }
  const known=new Set();for(const [l,g] of groups){known.add(l);g.dirs.forEach(d=>known.add(l+">"+d));}
  const orphans=st.exclude.filter(k=>!known.has(k));
  if(orphans.length){h+='<div class="line-group"><p class="muted" style="margin:4px 0">'+t("notRunning")+"</p>";
    orphans.forEach(k=>{h+='<label class="check"><input type="checkbox" data-k="'+esc(k)+'">'+esc(k.replace(">"," → "))+"</label>";});h+="</div>";}
  box.innerHTML=h;
  box.querySelectorAll("input").forEach(i=>i.onchange=()=>tog(i.dataset.k));
  const n=st.exclude.length;ex.querySelector("small").textContent=(n?t("hiddenN",{n:n}):t("allShown"))+" ▴";
}
async function search(q,box,onPick){
  q=q.trim();if(q.length<2)return;
  box.innerHTML='<p class="muted"><span class="spinner"></span>'+t("searching")+"</p>";
  try{
    const r=await job("/api/search?q="+encodeURIComponent(q));
    if(r.state!="done")throw 0;
    if(!r.result.length){box.innerHTML='<p class="muted">'+t("noResults")+"</p>";return;}
    box.innerHTML="";
    r.result.forEach(s=>{const b=document.createElement("button");b.className="result";
      b.innerHTML="<span><b>"+esc(s.name)+"</b><br><small>"+esc(s.place||"")+'</small></span><span class="plus">+</span>';b.onclick=()=>{box.innerHTML="";onPick(s);};box.appendChild(b);});
  }catch(e){box.innerHTML='<p class="muted">'+t("searchError")+"</p>";}
}
function searchStops(ev){ev.preventDefault();
  if(cfg.stops.length>=4){toast(t("maxStops"));return;}
  search($("q").value,$("results"),s=>{
    if(cfg.stops.some(x=>x.id==s.id))return;
    cfg.stops.push({id:s.id,name:s.name+(s.place&&!s.name.includes(s.place)&&s.place!="München"?", "+s.place:""),label:"",lat:s.lat,lon:s.lon,walk:0,types:255,exclude:[]});
    $("q").value="";dirty();renderAll();
  });
}
// ---------------------------------------------------------------- weather
function renderWx(){
  const w=cfg.weather;$("wxBox").hidden=!w.override;
  if(w.override)$("wxInfo").textContent=t("wxCustom",{s:w.name||(w.lat.toFixed(3)+", "+w.lon.toFixed(3))});
  else $("wxInfo").textContent=cfg.stops.length?t("wxFirst",{s:cfg.stops[0].name}):t("wxNone");
  $("wxLat").value=w.lat;$("wxLon").value=w.lon;
}
function setWx(){cfg.weather.override=$("wxOverride").checked;dirty();renderWx();}
function wxManual(){const a=parseFloat($("wxLat").value),b=parseFloat($("wxLon").value);if(!isNaN(a)&&!isNaN(b)){cfg.weather.lat=a;cfg.weather.lon=b;cfg.weather.name=t("custom");dirty();$("wxInfo").textContent=t("wxCustom",{s:cfg.weather.name});}}
function searchWx(ev){ev.preventDefault();search($("wxq").value,$("wxResults"),s=>{cfg.weather.lat=s.lat;cfg.weather.lon=s.lon;cfg.weather.name=s.name;$("wxq").value="";dirty();renderWx();});}
// ---------------------------------------------------------------- system
async function post(url,msg){try{await fetch(url,{method:"POST"});toast(t(msg));}catch(e){toast(t("offline"));}}
function confirmPost(url,q,msg){if(confirm(t(q)))post(url,msg);}
async function save(){
  try{
    const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)});
    if(!r.ok)throw 0;
    cfg=await r.json();lang=cfg.lang;$("savebar").classList.remove("show");toast(t("saved"));renderAll();
  }catch(e){toast(t("saveError"));}
}
function renderStatus(){
  const s=$("status");
  if(!info.version){s.innerHTML='<span class="dot warn"></span>'+t("offline");return;}
  let h='<span class="dot'+(info.apiError?" warn":"")+'"></span>'+t("online")+" · "+esc(info.ssid||"");
  if(info.apiError)h+=" · "+t("apiErr");
  else if(info.lastUpdate){const d=new Date(info.lastUpdate*1000);h+=" · "+t("updated",{t:d.toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"})});}
  s.innerHTML=h;
  const up=info.uptime>=86400?Math.floor(info.uptime/86400)+" d":Math.floor(info.uptime/3600)+" h "+Math.floor(info.uptime%3600/60)+" min";
  $("info").innerHTML="<dt>"+t("version")+"</dt><dd>"+esc(info.version)+"</dd><dt>"+t("ip")+"</dt><dd>"+esc(info.ip)+" · "+esc(info.host)+"</dd><dt>"+t("signal")+"</dt><dd>"+info.rssi+" dBm</dd><dt>"+t("heap")+"</dt><dd>"+Math.round(info.heap/1024)+" kB</dd><dt>"+t("uptime")+"</dt><dd>"+up+"</dd><dt>"+t("lastReset")+"</dt><dd>"+esc(t("rst_"+info.lastReset))+"</dd>";
}
async function refreshInfo(){try{info=await (await fetch("/api/info")).json();}catch(e){info={};}if(cfg)renderStatus();}
async function init(){
  try{cfg=await (await fetch("/api/settings")).json();}catch(e){cfg=null;}
  if(!cfg){cfg={lang:"de",stops:[],weather:{override:false,lat:48.1374,lon:11.5755,name:""},display:{brightness:80,auto:true},night:{mode:"dim",start:1320,end:390}};}
  lang=cfg.lang||"de";
  await refreshInfo();renderAll();setInterval(refreshInfo,30000);
}
init();
</script>
