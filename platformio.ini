; Abfahrt – MVG/MVV departures + weather for the ESP32 "Cheap Yellow Display"
; See README.md for flashing and DECISIONS.md for the reasoning behind settings.

[platformio]
default_envs = cyd_st7789

; ---------------------------------------------------------------------------
; Shared ESP32 settings
; ---------------------------------------------------------------------------
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Keep DTR/RTS released: the CYD's auto-reset circuit would otherwise hold
; EN/GPIO0 (= BOOT button) while the monitor is open.
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.4.2
    ESP32Async/AsyncTCP@^3.4.4
    ESP32Async/ESPAsyncWebServer@^3.7.10
build_src_filter = +<firmware/>
extra_scripts =
    pre:tools/build_web.py
    post:tools/merge_bin.py
build_flags =
    -std=gnu++17
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    ; AsyncTCP reserves 16 KB of stack by default; our handlers are small and
    ; the heap is needed for TLS (see DECISIONS.md, "Memory").
    -DCONFIG_ASYNC_TCP_STACK_SIZE=10240
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
; Firmware environments
; ---------------------------------------------------------------------------
; Two-USB CYD (micro-USB + USB-C) with ST7789 panel – verified on the owner's board.
[env:cyd_st7789]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DCYD_PANEL_ST7789=1
    -DPANEL_INVERT=0
    -DCORE_DEBUG_LEVEL=1

; Classic single-micro-USB CYD with ILI9341 panel.
[env:cyd_ili9341]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DCYD_PANEL_ST7789=0
    -DPANEL_INVERT=0
    -DCORE_DEBUG_LEVEL=1

; Debug build for the owner's board: verbose ESP-IDF/Arduino logging.
[env:cyd_st7789_debug]
extends = esp32_base
build_type = debug
build_flags =
    ${esp32_base.build_flags}
    -DCYD_PANEL_ST7789=1
    -DPANEL_INVERT=0
    -DCORE_DEBUG_LEVEL=3
    -DAPP_DEBUG=1

; ---------------------------------------------------------------------------
; Host environments
; ---------------------------------------------------------------------------
; Unit tests: parsers, departure logic, settings, i18n (no hardware, no LovyanGFX).
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_src_filter = +<native_stub/>
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
lib_ignore = ui
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -DNATIVE_BUILD=1
    -Wall

; Design preview: renders all screens from the fixtures into PNGs (docs/screenshots).
; Run with:  pio run -e preview && .pio/build/preview/program
[env:preview]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    lovyan03/LovyanGFX@^1.2.7
lib_compat_mode = off
build_src_filter = +<preview/>
build_flags =
    -std=gnu++17
    -DNATIVE_BUILD=1
    -DLGFX_PREVIEW=1
    -DLGFX_LINUX_FB
build_unflags =
lib_ldf_mode = deep+
